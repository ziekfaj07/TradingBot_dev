<!DOCTYPE html>
<html>
<head>
    <title>Backtest Page</title>
</head>
<body>

<h1>Backtest</h1>

<div>
  <label>Symbol</label>
  <input id="symbol" value="BTCUSDT" />

  <p> 
  <label>Interval</label>
  <select id="interval">
    <option value="15m">15m</option>
    <option value="1h" selected>1h</option>
    <option value="4h">4h</option>
    <option value="1d">1d</option>
  </select>

  <label>Market</label>
  <select id="market_type">
    <option value="futures">futures</option>
    <option value="spot" selected>spot</option>
  </select>
  </p>

  <label>Initial Balance</label>
  <input id="initial_balance" type="number" value="1000" />

  <p>
  <label>Fee Rate</label>
  <input id="fee_rate" type="number" step="0.0001" value="0.001" />

  <label>Slippage (bps)</label>
  <input id="slippage_bps" type="number" step="0.1" value="2" />

  <label>Leverage</label>
  <input id="leverage" type="number" step="1" value="1" />
  </p>

  <button id="runBtn">Run Backtest</button>
  <button id="exportBtn">Export CSV</button>

</div>

<hr/>

<div id="status"></div>

<h3>Results</h3>
<pre id="results"></pre>

<h3>Trades (last 200)</h3>
<pre id="trades"></pre>

<script>
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const tradesEl = document.getElementById("trades");

  function getParams() {
    const symbol = document.getElementById("symbol").value.trim().toUpperCase();
    const interval = document.getElementById("interval").value;
    const market_type = document.getElementById("market_type").value;
    const initial_balance = document.getElementById("initial_balance").value;
    const fee_rate = document.getElementById("fee_rate").value;
    const slippage_bps = document.getElementById("slippage_bps").value;
    const leverage = document.getElementById("leverage").value;

    return { symbol, interval, market_type, initial_balance, fee_rate, slippage_bps, leverage };
  }

  document.getElementById("runBtn").addEventListener("click", async () => {
    const p = getParams();
    statusEl.textContent = "Running backtest...";
    resultsEl.textContent = "";
    tradesEl.textContent = "";

    const url =
      `/api/backtest/${encodeURIComponent(p.symbol)}` +
      `?interval=${encodeURIComponent(p.interval)}` +
      `&market_type=${encodeURIComponent(p.market_type)}` +
      `&initial_balance=${encodeURIComponent(p.initial_balance)}` +
      `&fee_rate=${encodeURIComponent(p.fee_rate)}` +
      `&slippage_bps=${encodeURIComponent(p.slippage_bps)}` +
      `&leverage=${encodeURIComponent(p.leverage)}`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok) {
        statusEl.textContent = "Error";
        resultsEl.textContent = JSON.stringify(data, null, 2);
        return;
      }

      statusEl.textContent = "Done ✅";
      resultsEl.textContent = JSON.stringify(data.results, null, 2);
      tradesEl.textContent = JSON.stringify(data.trades, null, 2);

    } catch (e) {
      statusEl.textContent = "Request failed";
      resultsEl.textContent = String(e);
    }
  });

  document.getElementById("exportBtn").addEventListener("click", async () => {
    const p = getParams();
    statusEl.textContent = "Exporting CSV...";

    const url =
      `/api/export/${encodeURIComponent(p.symbol)}` +
      `?interval=${encodeURIComponent(p.interval)}` +
      `&market_type=${encodeURIComponent(p.market_type)}`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      statusEl.textContent = data.ok ? `Exported: ${data.file_path}` : "Export failed";
    } catch (e) {
      statusEl.textContent = "Export request failed";
    }
  });
</script>


</body>
</html>
