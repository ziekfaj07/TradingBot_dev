<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Backtest Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #334155;
      --blue: #38bdf8;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(4, 1fr);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
    }

    input, select, button, textarea {
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      font-family: Consolas, Monaco, monospace;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      opacity: 0.75;
    }

    pre {
      white-space: pre-wrap;
      overflow: auto;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      max-height: 360px;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .muted {
      color: var(--muted);
    }

    .wide {
      grid-column: 1 / -1;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row" style="justify-content: space-between;">
      <div>
        <h1>Backtest</h1>
        <div class="muted">Run one-shot strategy tests with config aligned to the live engine.</div>
      </div>
      <div>
        <a href="/dashboard">Go to Dashboard</a>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <div class="field">
          <label>Symbol</label>
          <input id="symbol" value="BTCUSDT" />
        </div>

        <div class="field">
          <label>Interval</label>
          <select id="interval">
            <option value="1m">1m</option>
            <option value="3m">3m</option>
            <option value="5m">5m</option>
            <option value="15m">15m</option>
            <option value="30m">30m</option>
            <option value="1h" selected>1h</option>
            <option value="4h">4h</option>
            <option value="1d">1d</option>
          </select>
        </div>

        <div class="field">
          <label>Market Type</label>
          <select id="market_type">
            <option value="spot" selected>Spot</option>
            <option value="futures">Futures</option>
          </select>
        </div>

        <div class="field">
          <label>Initial Balance</label>
          <input id="initial_balance" type="number" value="1000" />
        </div>

        <div class="field">
          <label>Fee Rate</label>
          <input id="fee_rate" type="number" step="0.0001" value="0.001" />
        </div>

        <div class="field">
          <label>Slippage (bps)</label>
          <input id="slippage_bps" type="number" step="0.1" value="2" />
        </div>

        <div class="field">
          <label>Leverage</label>
          <input id="leverage" type="number" step="1" value="1" />
        </div>

        <div class="field">
          <label>Allow Short</label>
          <select id="allow_short">
            <option value="false" selected>False</option>
            <option value="true">True</option>
          </select>
        </div>

        <div class="field">
          <label>Max Quantity</label>
          <input id="max_qty" type="number" step="0.0001" value="10" />
        </div>

        <div class="field">
          <label>Position Sizing</label>
          <select id="position_sizing_mode">
            <option value="all_in" selected>All In</option>
            <option value="fixed_usdt">Fixed USDT</option>
            <option value="fixed_pct">Fixed % of Cash</option>
            <option value="equity_pct">Fixed % of Equity</option>
            <option value="risk_pct">Risk %</option>
          </select>
        </div>

        <div class="field">
          <label>Sizing Value</label>
          <input id="position_size_value" type="number" step="0.0001" placeholder="Required for non all-in" />
        </div>

        <div class="field">
          <label>Strategy</label>
          <select id="strategy_name">
            <option value="ema_crossover" selected>EMA Crossover</option>
            <option value="donchian_breakout">Donchian Breakout</option>
            <option value="three_candle_reversal">Three Candle Reversal</option>
            <option value="bollinger_mean_reversion">Bollinger Mean Reversion</option>
          </select>
        </div>

        <div class="field">
          <label>Candle Limit</label>
          <input id="candle_limit" type="number" step="1" value="300" />
        </div>

        <div class="field">
          <label>Start</label>
          <input id="start" placeholder="Optional" />
        </div>

        <div class="field">
          <label>End</label>
          <input id="end" placeholder="Optional" />
        </div>

        <div class="field wide">
          <label>Strategy Parameters</label>
          <textarea id="strategy_params_json" placeholder='Defaults populate from the selected strategy. Example: {"short":9,"long":21}'></textarea>
          <div class="muted">Select a strategy to load its default parameters. Edit this JSON only when you want to override the selected strategy defaults.</div>
        </div>
      </div>

      <div class="row" style="margin-top: 14px;">
        <button id="runBtn">Run Backtest</button>
        <button id="exportBtn">Export CSV</button>
      </div>
    </div>

    <div class="card">
      <h3>Status</h3>
      <div id="status" class="muted">Idle</div>
    </div>

    <div class="card">
      <h3>Results</h3>
      <pre id="results"></pre>
    </div>

    <div class="card">
      <h3>Trades</h3>
      <pre id="trades"></pre>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const tradesEl = document.getElementById("trades");

    const FALLBACK_STRATEGY_DEFAULT_PARAMS = Object.freeze({
      ema_crossover: { short: 9, long: 21 },
      donchian_breakout: { lookback: 20 },
      three_candle_reversal: {
        min_body_ratio: 0.55,
        require_full_range_engulf: true,
        confirm_break_prev_extreme: true,
      },
      bollinger_mean_reversion: {
        length: 20,
        std_dev: 2.0,
        min_band_width_pct: 0.01,
        exit_on_mid: true,
        allow_short: false,
      },
    });

    let strategyDefaultParams = cloneJson(FALLBACK_STRATEGY_DEFAULT_PARAMS);

    function buildHeaders() {
      const headers = { "Content-Type": "application/json" };
      const apiKey = String(window.localStorage.getItem("tradingbot_api_key") || "").trim();
      if (apiKey) {
        headers["X-API-Key"] = apiKey;
      }
      return headers;
    }

    function cloneJson(value) {
      return JSON.parse(JSON.stringify(value || {}));
    }

    function strategyDefaults(strategyName) {
      const key = String(strategyName || "ema_crossover").trim().toLowerCase();
      return cloneJson(strategyDefaultParams[key] || FALLBACK_STRATEGY_DEFAULT_PARAMS[key] || {});
    }

    function syncStrategyParamsForSelection(force = false) {
      const strategyEl = document.getElementById("strategy_name");
      const paramsEl = document.getElementById("strategy_params_json");
      if (!strategyEl || !paramsEl) return;

      if (!force && String(paramsEl.value || "").trim()) return;

      paramsEl.value = JSON.stringify(strategyDefaults(strategyEl.value), null, 2);
    }

    async function loadStrategyCatalog() {
      strategyDefaultParams = cloneJson(FALLBACK_STRATEGY_DEFAULT_PARAMS);

      try {
        const res = await fetch("/api/strategies", { headers: buildHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const catalog = await res.json();
        const defaults = cloneJson(FALLBACK_STRATEGY_DEFAULT_PARAMS);

        for (const item of catalog?.strategies || []) {
          const name = String(item?.name || "").trim().toLowerCase();
          if (!name) continue;
          defaults[name] = cloneJson(item?.default_params || {});
        }

        strategyDefaultParams = defaults;
      } catch (e) {
        console.warn("Strategy catalog load skipped; using fallback defaults:", e);
      }

      syncStrategyParamsForSelection(false);
    }

    function readStrategyParams() {
      const strategyName = document.getElementById("strategy_name").value;
      const raw = String(document.getElementById("strategy_params_json").value || "").trim();
      let params = raw ? JSON.parse(raw) : strategyDefaults(strategyName);

      if (!params || typeof params !== "object" || Array.isArray(params)) {
        throw new Error("Strategy Parameters must be a JSON object.");
      }

      return params;
    }

    function getParams() {
      const strategyName = document.getElementById("strategy_name").value;
      const strategyParams = readStrategyParams();
      return {
        symbol: document.getElementById("symbol").value.trim().toUpperCase(),
        interval: document.getElementById("interval").value,
        market_type: document.getElementById("market_type").value,
        initial_balance: Number(document.getElementById("initial_balance").value),
        fee_rate: Number(document.getElementById("fee_rate").value),
        slippage_bps: Number(document.getElementById("slippage_bps").value),
        leverage: Number(document.getElementById("leverage").value),
        allow_short: document.getElementById("allow_short").value === "true",
        max_qty: Number(document.getElementById("max_qty").value),
        position_sizing_mode: document.getElementById("position_sizing_mode").value,
        position_size_value: document.getElementById("position_size_value").value
          ? Number(document.getElementById("position_size_value").value)
          : null,
        strategy_name: strategyName,
        strategy_params: strategyParams,
        ...(strategyName === "ema_crossover"
          ? {
              ema_short: Number(strategyParams.short),
              ema_long: Number(strategyParams.long),
            }
          : {}),
        candle_limit: Number(document.getElementById("candle_limit").value),
        start: document.getElementById("start").value.trim() || null,
        end: document.getElementById("end").value.trim() || null
      };
    }

    document.getElementById("runBtn").addEventListener("click", async () => {
      statusEl.textContent = "Running backtest...";
      resultsEl.textContent = "";
      tradesEl.textContent = "";

      try {
        const p = getParams();
        const res = await fetch("/api/run/backtest", {
          method: "POST",
          headers: buildHeaders(),
          body: JSON.stringify(p),
        });
        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = "Error";
          resultsEl.textContent = JSON.stringify(data, null, 2);
          return;
        }

        statusEl.textContent = "Done";
        resultsEl.textContent = JSON.stringify(data.result ?? data, null, 2);
        tradesEl.textContent = JSON.stringify(data.result?.trades ?? [], null, 2);
      } catch (e) {
        statusEl.textContent = "Request failed";
        resultsEl.textContent = String(e);
      }
    });

    document.getElementById("exportBtn").addEventListener("click", async () => {
      const p = {
        symbol: document.getElementById("symbol").value.trim().toUpperCase(),
        interval: document.getElementById("interval").value,
        market_type: document.getElementById("market_type").value,
      };
      statusEl.textContent = "Exporting CSV...";

      const url =
        `/api/export/${encodeURIComponent(p.symbol)}` +
        `?interval=${encodeURIComponent(p.interval)}` +
        `&market_type=${encodeURIComponent(p.market_type)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        statusEl.textContent = data.ok ? `Exported: ${data.file_path}` : "Export failed";
      } catch (e) {
        statusEl.textContent = "Export request failed";
      }
    });

    document.getElementById("strategy_name").addEventListener("change", () => {
      syncStrategyParamsForSelection(true);
    });

    loadStrategyCatalog();
  </script>
</body>
</html>
